<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÑØÛR - Ultra Secure</title>
    <style>
        :root { --accent: #ff0055; --secondary: #00f2ff; --bg: #050505; }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: var(--bg); color: white; font-family: sans-serif; height: 100vh; width: 100vw; overflow: hidden; display: flex; align-items: center; justify-content: center; }

        #lock-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; color: white; width: 280px; text-align: center; outline: none; }
        
        .btn-modern { padding: 12px 35px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; transition: transform 0.1s; }
        
        #main-content { display: none; width: 100%; text-align: center; }
        .glass-container { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); padding: 40px; border-radius: 30px; width: 90%; max-width: 500px; margin: auto; }

        .page { display: none; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

        /* تعديل الزرار الهارب */
        #truth-box { 
            position: fixed; 
            z-index: 9999; 
            background: #00ff88; 
            color: black;
            /* نلغي الـ transform تماماً عشان الحسابات تبقا دقيقة */
            transform: none !important; 
            transition: left 0.15s ease-out, top 0.15s ease-out;
            pointer-events: auto;
        }

        #lie-box { background: var(--accent); color: white; }
        .finger-icon { position: fixed; font-size: 50px; z-index: 999; animation: fly 1s forwards; }
        @keyframes fly { from {bottom: -10%;} to {bottom: 110%;} }
        .glitch { font-size: 3rem; color: var(--accent); animation: shake 0.1s infinite; }
        @keyframes shake { 0% {transform:translate(2px)} 50% {transform:translate(-2px)} }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="lock-screen">
        <h2 style="margin-bottom:20px;">الباسورد يا عبيط</h2>
        <input type="password" id="pass-field">
        <button class="btn-modern" onclick="auth()" style="margin-top:20px;">Access</button>
    </div>

    <div id="main-content">
        <div class="glass-container">
            <div class="page" style="display: block;" id="p1">
                <h1>بتحبك يا ديشا؟</h1>
                <button class="btn-modern" style="background:var(--secondary); margin-top:20px;" onclick="go(2)">تحقق</button>
            </div>
            <div class="page" id="p2">
                <h1>اختار الحقيقة</h1>
                <div style="height: 300px;">
                    <button class="btn-modern" id="truth-box">بتموت فيا</button>
                    <button class="btn-modern" id="lie-box" onclick="go(3)" style="margin-top:100px;">بتكرهني</button>
                </div>
            </div>
            <div class="page" id="p3"><h1>عشان بتحب نور</h1><button class="btn-modern" onclick="theEnd()">ماشي</button></div>
            <div class="page" id="p5"><h1 class="glitch">🖕 خد يا زنجي</h1></div>
        </div>
    </div>

    <script>
        const _0xHASH = "bm91ciAzYW15IHcgM2FtIDN5YWx5";
        const truthBtn = document.getElementById('truth-box');

        function auth() {
            if(btoa(document.getElementById('pass-field').value.toLowerCase()) === _0xHASH) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }
        }

        function go(n) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('p' + n).style.display = 'block';
        }

        // الحسابات الدقيقة للهروب
        document.addEventListener('mousemove', (e) => {
            if (document.getElementById('p2').style.display !== 'block') return;

            const rect = truthBtn.getBoundingClientRect();
            // مركز الزرار
            const btnX = rect.left + rect.width / 2;
            const btnY = rect.top + rect.height / 2;
            
            // المسافة بين الماوس والزرار
            const dist = Math.hypot(e.clientX - btnX, e.clientY - btnY);

            if (dist < 150) {
                const padding = 20; // مسافة أمان من حافة الشاشة
                
                // حساب أقصى مسافة مسموحة (عرض الشاشة - عرض الزرار - الأمان)
                const maxX = window.innerWidth - rect.width - padding;
                const maxY = window.innerHeight - rect.height - padding;

                // توليد إحداثيات عشوائية "آمنة"
                let newX = Math.random() * maxX;
                let newY = Math.random() * maxY;

                // التأكد إنها مش أقل من الأمان
                newX = Math.max(padding, newX);
                newY = Math.max(padding, newY);

                truthBtn.style.left = newX + 'px';
                truthBtn.style.top = newY + 'px';
            }
        });

        function theEnd() {
            go(5);
            setInterval(() => {
                const f = document.createElement('div');
                f.className = 'finger-icon'; f.innerText = '🖕';
                f.style.left = Math.random() * 90 + 'vw';
                document.body.appendChild(f);
                setTimeout(() => f.remove(), 1000);
            }, 100);
        }
    </script>
</body>
</html>
